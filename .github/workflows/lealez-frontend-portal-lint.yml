name: Lealez Frontend Portal Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint PHP
        run: |
          php -l lealez.php
          php -l includes/frontend/class-lealez-frontend-portal.php
          php -l includes/frontend/lealez-frontend-pages-trait.php
          php -l includes/frontend/lealez-frontend-business-trait.php
          php -l includes/frontend/lealez-frontend-location-trait.php
          php -l includes/frontend/lealez-frontend-user-helpers-trait.php

      - name: Check JavaScript syntax
        run: node --check assets/js/frontend/lealez-frontend-portal.js
