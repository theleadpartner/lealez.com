name: Finalize unified location profile

on:
  push:
    branches:
      - feature/unified-location-profile

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-location-profile
          fetch-depth: 0

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Update installer, version and documentation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          pages_path = Path('includes/frontend/lealez-frontend-pages-trait.php')
          pages = pages_path.read_text(encoding='utf-8')

          legacy_block = """            'location_google' => array(
                'title' => __( 'Google de ubicación', 'lealez' ),
                'slug' => 'google-ubicacion',
                'shortcode' => '[lealez_location_google_center]',
                'description' => __( 'Perfil, contenido, reseñas, sincronización y analítica GMB.', 'lealez' ),
                'parent' => 'portal',
            ),
"""
          if legacy_block in pages:
              pages = pages.replace(legacy_block, '', 1)
          elif "'location_google' => array(" in pages:
              raise SystemExit('Could not safely remove legacy location_google definition')

          pages = pages.replace(
              "'description' => __( 'Perfil de ubicación organizado por pestañas.', 'lealez' ),",
              "'description' => __( 'Perfil unificado con datos internos, Google Business Profile, contenido, interacción y analítica.', 'lealez' ),",
              1,
          )

          created_line = "        $created = isset( $_GET['lealez_pages_created'] ) ? absint( $_GET['lealez_pages_created'] ) : 0;\n"
          legacy_vars = """        $page_ids = get_option( self::PAGE_OPTION, array() );
        $legacy_id = is_array( $page_ids ) && isset( $page_ids['location_google'] ) ? absint( $page_ids['location_google'] ) : 0;
        $legacy_page = $legacy_id ? get_post( $legacy_id ) : null;
"""
          if '$legacy_page =' not in pages:
              if created_line not in pages:
                  raise SystemExit('Could not find page installer variables')
              pages = pages.replace(created_line, created_line + legacy_vars, 1)

          form_marker = """            <form method=\"post\" action=\"<?php echo esc_url( admin_url( 'admin-post.php' ) ); ?>\" style=\"margin:18px 0;\">
"""
          legacy_notice = """            <?php if ( $legacy_page && 'trash' !== $legacy_page->post_status ) : ?>
                <div class=\"notice notice-info\"><p><strong><?php esc_html_e( 'Perfil de ubicación unificado:', 'lealez' ); ?></strong> <?php esc_html_e( 'La antigua página “Google de ubicación” se conserva únicamente para redirigir enlaces existentes hacia “Editar ubicación”. Ya no se crea ni se administra como una página independiente.', 'lealez' ); ?></p></div>
            <?php endif; ?>
"""
          if 'La antigua página “Google de ubicación”' not in pages:
              if form_marker not in pages:
                  raise SystemExit('Could not find page installer form marker')
              pages = pages.replace(form_marker, legacy_notice + form_marker, 1)

          pages_path.write_text(pages, encoding='utf-8')

          plugin_path = Path('lealez.php')
          plugin = plugin_path.read_text(encoding='utf-8')
          replacements = {
              'Version: 1.1.0': 'Version: 1.3.0',
              '@version 1.1.0': '@version 1.3.0',
              "public $version = '1.1.0';": "public $version = '1.3.0';",
          }
          for old, new in replacements.items():
              if old in plugin:
                  plugin = plugin.replace(old, new, 1)
              elif new not in plugin:
                  raise SystemExit(f'Missing version marker: {old}')
          plugin_path.write_text(plugin, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('plugin%20version-1.1.0-3782c4', 'plugin%20version-1.3.0-3782c4')
          readme = re.sub(r'- \*\*Commit de referencia:\*\* `[^`]+`', '- **Commit de referencia:** rama `main`, versión funcional `1.3.0`', readme, count=1)
          readme = readme.replace('- **Versión declarada en `lealez.php`:** `1.1.0`', '- **Versión declarada en `lealez.php`:** `1.3.0`')

          marker = '<!-- LEALEZ_UNIFIED_LOCATION_PROFILE_1_3_0 -->'
          section = r'''

---

<!-- LEALEZ_UNIFIED_LOCATION_PROFILE_1_3_0 -->
### Perfil unificado de ubicación — versión 1.3.0

Desde la versión `1.3.0`, una ubicación tiene **un único perfil frontend**. La página `Editar ubicación`, publicada mediante `[lealez_location_editor]`, reúne en la misma navegación:

- datos administrativos internos de Lealez;
- vinculación y control de sincronización con Google Business Profile;
- información básica, dirección, áreas de servicio, contacto y horarios;
- atributos de la sección “Más”;
- fotos, menú, servicios y publicaciones;
- opiniones y respuestas;
- rendimiento, frases de búsqueda y horario de mayor interés.

La página que antes se generaba como `Google de ubicación` ya no forma parte del instalador. Cuando existe en una instalación actualizada, se conserva como ruta de compatibilidad y redirige a `Editar ubicación`, preservando `location_id` y el módulo solicitado. No se elimina automáticamente para evitar romper enlaces, menús o marcadores existentes.

#### Leyenda de sincronización

Cada sección muestra uno de los siguientes alcances:

| Indicador | Significado |
|---|---|
| **Sincroniza con Google** | El módulo guarda primero en Lealez y dispone de un flujo de envío a Google Business Profile. |
| **Datos de Google** | Información obtenida desde Google; puede guardarse como caché o snapshot local, pero Google es la fuente. |
| **Solo Lealez** | Información administrativa que nunca se incluye en solicitudes a Google. |
| **Mixto** | La misma sección contiene campos de Google y campos locales; el panel enumera cada grupo. |
| **Control técnico** | Vinculación, límites, logs o coordinación del proceso; no representa contenido público del perfil. |

En la creación inicial, los campos compatibles también reciben una etiqueta visual. La ubicación debe guardarse primero para obtener un ID seguro; después continúa en el mismo perfil unificado y se habilitan los módulos de envío y verificación.

#### Estados de publicación

Guardar un formulario en WordPress **no significa** que el cambio ya esté publicado en Google. Los módulos compatibles mantienen el flujo:

1. editar el dato;
2. guardar localmente;
3. enviar a Google Business Profile;
4. verificar el estado devuelto por Google.

La interfaz diferencia los estados `Guardado · falta enviar`, `Enviado · en cola`, `Google está revisando`, `Aplicado en Google`, `Aplicado parcialmente`, `No aplicado`, `Google devolvió otro valor`, `Pendiente de verificación`, `Requiere corregir datos` y `Error de envío`.

Google conserva la decisión final. Una solicitud puede aplicarse inmediatamente, quedar en revisión, aplicarse parcialmente, ser modificada o ser rechazada. Lealez solo presenta `Aplicado en Google` cuando el verificador del módulo lo confirma.

#### Separación de campos

Los campos exclusivamente internos incluyen, entre otros:

- empresa propietaria y nombre interno de la ficha;
- código y estado administrativo;
- configuración de lealtad;
- responsable, correo, teléfono y notas internas.

Los módulos de dirección, contacto público, horarios, atributos y menú reutilizan los metaboxes originales y sus handlers AJAX, nonces, jobs, logs y verificadores. Las secciones mixtas detallan cuáles campos participan en el intercambio con Google y cuáles permanecen solo en Lealez.

#### Compatibilidad y permisos

- No se duplican meta keys ni se crea una segunda lógica de publicación.
- No se modifican los archivos de los CPT ni de los metaboxes existentes.
- Los permisos se calculan por empresa y ubicación.
- Los gerentes y administradores autorizados no reciben `manage_options` global.
- La vinculación crítica de la propiedad de Google permanece protegida.
- Las páginas personalizadas siguen excluidas del caché de página completa.
- La página `Google de empresa` continúa separada porque administra OAuth, cuentas y propiedades de la empresa, no el contenido de una ubicación individual.
'''
          if marker not in readme:
              readme += section
          readme_path.write_text(readme, encoding='utf-8')

          changelog = '''# Changelog

Todos los cambios relevantes del plugin se documentan en este archivo.

## [1.3.0] - 2026-07-30

### Agregado
- Perfil frontend unificado para `oy_location` dentro de `[lealez_location_editor]`.
- Leyenda y etiquetas por sección/campo: Google, datos de Google, solo Lealez, mixto y control técnico.
- Formulario específico para datos administrativos internos sin exposición a Google.
- Resumen de estados locales, envíos, revisión y aplicación en Google.
- Compatibilidad responsive y anotación de campos durante la creación inicial.

### Modificado
- `Editar ubicación` concentra datos internos, GMB, contenido, interacción y analítica.
- El instalador deja de crear la página independiente `Google de ubicación`.
- Los enlaces existentes de la antigua página redirigen al perfil unificado conservando ubicación y módulo.
- La documentación de publicación distingue guardado local, envío y aprobación de Google.
- Versión del plugin actualizada a `1.3.0`.

### Conservado
- La página `Google de empresa` para OAuth, cuentas y propiedades.
- Los metaboxes, handlers AJAX, nonces, jobs, logs y verificadores originales.
- Las meta keys y funciones existentes de los CPT.

## [1.2.0] - 2026-07-30

### Agregado
- Centros frontend para reutilizar módulos reales de Google Business Profile.
- Puente de permisos limitado a empresas y ubicaciones autorizadas.
- Estados de publicación y revisión de Google.

## [1.1.0] - 2026-07-30

### Agregado
- Portal frontend de empresas, ubicaciones y perfil del usuario.
- Instalador de páginas con shortcodes.
- Archivo y restauración sin eliminación de datos.
'''
          Path('CHANGELOG.md').write_text(changelog, encoding='utf-8')
          PY

      - name: Validate PHP syntax
        run: |
          php -l lealez.php
          php -l includes/frontend/class-lealez-frontend-portal.php
          php -l includes/frontend/class-lealez-frontend-unified-location-profile.php
          php -l includes/frontend/lealez-unified-location-routing-trait.php
          php -l includes/frontend/lealez-unified-location-render-trait.php
          php -l includes/frontend/lealez-unified-location-modules-trait.php
          php -l includes/frontend/lealez-unified-location-internal-trait.php
          php -l includes/frontend/lealez-unified-location-metabox-trait.php
          php -l includes/frontend/lealez-unified-location-access-trait.php
          php -l includes/frontend/lealez-frontend-pages-trait.php

      - name: Validate trait composition
        run: |
          php -r '
          define("ABSPATH", __DIR__ . "/");
          function add_action() {}
          function add_filter() {}
          require "includes/frontend/class-lealez-frontend-unified-location-profile.php";
          if (!class_exists("Lealez_Frontend_Unified_Location_Profile")) { exit(1); }
          echo "Unified location class loaded\n";
          '

      - name: Validate JavaScript and migration guards
        run: |
          node --check assets/js/frontend/lealez-frontend-unified-location.js
          ! grep -q "'location_google' => array(" includes/frontend/lealez-frontend-pages-trait.php
          grep -q "redirect_legacy_google_location_page" includes/frontend/lealez-unified-location-routing-trait.php
          grep -q "Sincroniza con Google" includes/frontend/lealez-unified-location-modules-trait.php
          grep -q "Solo Lealez" includes/frontend/lealez-unified-location-internal-trait.php
          grep -q "Version: 1.3.0" lealez.php
          grep -q "LEALEZ_UNIFIED_LOCATION_PROFILE_1_3_0" README.md
          grep -q "## \[1.3.0\]" CHANGELOG.md

      - name: Commit finalized files
        run: |
          if git diff --quiet && [ -f CHANGELOG.md ] && git ls-files --error-unmatch CHANGELOG.md >/dev/null 2>&1; then
            echo "No documentation or installer changes pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/frontend/lealez-frontend-pages-trait.php lealez.php README.md CHANGELOG.md
          git commit -m "docs: finalize unified location profile version 1.3.0"
          git push origin HEAD:feature/unified-location-profile
